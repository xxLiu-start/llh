name: Skill training tests

on:
  push:
    branches:
      - codex/skill-training-quality-2026-11-22
  pull_request:
    paths:
      - "src/lh_harness/skills/**"
      - "tests/**"
      - "experiments/skill_evolution/**"
      - "pyproject.toml"
      - ".github/workflows/skill-training-tests.yml"

permissions:
  contents: read

concurrency:
  group: skill-training-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run complete pytest suite
        run: python -m pytest -q
